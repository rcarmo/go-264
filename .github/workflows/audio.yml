name: Audio qualification

on:
  push:
    branches: [master]
    paths:
      - 'audio/**'
      - 'go.mod'
      - 'Makefile'
      - 'scripts/project-tmp.sh'
      - 'scripts/project-env.sh'
      - 'scripts/test-profile.sh'
      - '.github/workflows/audio.yml'
  pull_request:
    paths:
      - 'audio/**'
      - 'go.mod'
      - 'Makefile'
      - 'scripts/project-tmp.sh'
      - 'scripts/project-env.sh'
      - 'scripts/test-profile.sh'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    name: Linux amd64 tests, race and FFmpeg oracles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install FFmpeg oracle
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Initialise project scratch
        run: echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/go-264" >> "$GITHUB_ENV"
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: make tmp-init && go test -count=1 ./audio/...
      - name: Test purego
        env:
          CGO_ENABLED: '0'
        run: CGO_ENABLED=0 go test -count=1 -tags purego ./audio/...
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: make tmp-init && go vet ./audio/...
      - name: Race
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./audio/...
      - name: FFmpeg oracle
        env:
          CGO_ENABLED: '0'
          GO264_AUDIO_ORACLE: '1'
        run: go test -count=1 -timeout 20m ./audio/...

      - name: Remove completed disposable Go scratch
        if: always()
        run: |
          root="$RUNNER_TEMP/go-264"
          test "$(realpath -m "$root")" = "$(realpath -m "$RUNNER_TEMP")/go-264"
          if test -d "$root" && test ! -L "$root" && test -O "$root"; then
            for part in cache build runs tests logs; do
              path="$root/$part"
              if test -d "$path" && test ! -L "$path" && test -O "$path"; then rm -rf -- "$path"; fi
            done
          fi

  linux-arm64:
    name: Native Linux arm64 tests and race
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Confirm native architecture
        run: test "$(go env GOHOSTARCH)" = arm64 && test "$(uname -m)" = aarch64
      - name: Initialise project scratch
        run: echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/go-264" >> "$GITHUB_ENV"
      - name: Test
        env:
          CGO_ENABLED: '0'
        run: make tmp-init && go test -count=1 ./audio/...
      - name: Test purego
        env:
          CGO_ENABLED: '0'
        run: CGO_ENABLED=0 go test -count=1 -tags purego ./audio/...
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: make tmp-init && go vet ./audio/...
      - name: Race
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./audio/...
      - name: Remove completed disposable Go scratch
        if: always()
        run: |
          root="$RUNNER_TEMP/go-264"
          test "$(realpath -m "$root")" = "$(realpath -m "$RUNNER_TEMP")/go-264"
          if test -d "$root" && test ! -L "$root" && test -O "$root"; then
            for part in cache build runs tests logs; do
              path="$root/$part"
              if test -d "$path" && test ! -L "$path" && test -O "$path"; then rm -rf -- "$path"; fi
            done
          fi
